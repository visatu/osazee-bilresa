blueprint:
  name: IKEA BILRESA Two-Button Light Control
  description: >-
    Button 1 turns selected lights on, double-clicks cooler, and holds to brighten.
    Button 2 turns selected lights off, double-clicks warmer, and holds to dim.
  domain: automation
  author: OSAZEE
  source_url: https://github.com/odggg/osazee-bilresa/blob/main/blueprints/automation/OSAZEE/ikea_bilresa_dual_button.yaml
  homeassistant:
    min_version: 2026.8.0
  input:
    remotes:
      name: Remotes
      description: Select the two native button event entities for each remote.
      icon: mdi:remote
      input:
        remote_list:
          name: Add remote
          default:
          - name: Remote 1
          selector:
            object:
              multiple: true
              label_field: name
              fields:
                name:
                  label: Remote name
                  required: true
                  selector:
                    text:
                      multiple: false
                      multiline: false
                button_1:
                  label: Button 1
                  required: true
                  selector:
                    entity:
                      filter:
                      - domain:
                        - event
                      multiple: false
                button_2:
                  label: Button 2
                  required: true
                  selector:
                    entity:
                      filter:
                      - domain:
                        - event
                      multiple: false
    lights:
      name: Lights and dimming
      icon: mdi:lightbulb-group
      collapsed: true
      input:
        light_entity:
          name: Lights to control
          description: Select the lights used by clicks and holds.
          default: []
          selector:
            entity:
              filter:
              - domain:
                - light
              multiple: true
        brightness_ramp_seconds:
          name: Full brightness ramp time
          description: Time to dim from minimum to maximum brightness.
          default: 3
          selector:
            number:
              min: 1.0
              max: 10.0
              step: 0.1
              unit_of_measurement: s
              mode: slider
        latency_compensation_seconds:
          name: Dimming latency compensation
          description: Compensates for delay before the button release event arrives.
          default: 0.06
          selector:
            number:
              min: 0.0
              max: 1.0
              step: 0.01
              unit_of_measurement: s
              mode: slider
        color_temp_dimming:
          name: Change color temperature while dimming
          description: Ramp color temperature between the limits along with brightness.
          default: false
          selector:
            boolean: {}
        warm_kelvin:
          name: Warm color temperature limit
          description: Warm endpoint for dimming and double-click steps.
          default: 2450
          selector:
            number:
              min: 1500.0
              max: 10000.0
              step: 100.0
              unit_of_measurement: K
              mode: slider
        cold_kelvin:
          name: Cold color temperature limit
          description: Cold endpoint for dimming and double-click steps.
          default: 5000
          selector:
            number:
              min: 1500.0
              max: 6500.0
              step: 100.0
              unit_of_measurement: K
              mode: slider
        color_temp_double_click_step_kelvin:
          name: Double-click color temperature step
          default: 500
          selector:
            number:
              min: 100.0
              max: 1000.0
              step: 100.0
              unit_of_measurement: K
              mode: slider
        color_temp_double_click_transition_seconds:
          name: Double-click color temperature transition
          description: Fade duration for each color-temperature step.
          default: 0.5
          selector:
            number:
              min: 0.0
              max: 5.0
              step: 0.1
              unit_of_measurement: s
              mode: slider
        release_transition_seconds:
          name: Release transition
          description: Fade duration when dimming stops on release.
          default: 0.2
          selector:
            number:
              min: 0.0
              max: 2.0
              step: 0.05
              unit_of_measurement: s
              mode: slider
mode: single
max_exceeded: silent
variables:
  remote_list: !input remote_list
  configured_remotes: >-
    {{ remote_list
       | selectattr('button_1', 'defined')
       | selectattr('button_2', 'defined')
       | selectattr('button_1', 'match', '^event\\.')
       | selectattr('button_2', 'match', '^event\\.')
       | list }}
  remote_entity_ids: >-
    {{ (configured_remotes | map(attribute='button_1') | list)
       + (configured_remotes | map(attribute='button_2') | list) }}
  light_entity: !input light_entity
  dimming_light_entities: >-
    {{ ([light_entity] if light_entity is string else (light_entity or []))
       | unique | list }}
  scaled_ramp_time: !input brightness_ramp_seconds
  latency_compensation_offset: !input latency_compensation_seconds
  release_transition: !input release_transition_seconds
  color_temp_dimming: !input color_temp_dimming
  warm_kelvin_input: !input warm_kelvin
  cold_kelvin_input: !input cold_kelvin
  warm_kelvin: '{{ [warm_kelvin_input, cold_kelvin_input] | min }}'
  cold_kelvin: '{{ [warm_kelvin_input, cold_kelvin_input] | max }}'
  color_temp_double_click_step_kelvin: !input color_temp_double_click_step_kelvin
  color_temp_double_click_transition: !input color_temp_double_click_transition_seconds
triggers:
- trigger: event
  event_type: state_changed
conditions:
- condition: template
  value_template: >-
    {{ trigger.event.data.entity_id in remote_entity_ids
       and remote_entity_ids | count == remote_entity_ids | unique | list | count }}
- condition: template
  value_template: >-
    {% set old = trigger.event.data.old_state %}
    {% set new = trigger.event.data.new_state %}
    {{ old is not none and new is not none
       and old.state not in ['unknown', 'unavailable']
       and new.state not in ['unknown', 'unavailable']
       and not old.attributes.get('restored', false)
       and not new.attributes.get('restored', false)
       and as_timestamp(new.state, 0) > as_timestamp(old.state, 0)
       and new.attributes.get('event_type') in ['multi_press_1', 'multi_press_2', 'long_press'] }}
actions:
- variables:
    source_entity: '{{ trigger.event.data.entity_id }}'
    active_remote: >-
      {{ ((configured_remotes | selectattr('button_1', 'eq', source_entity) | list)
          + (configured_remotes | selectattr('button_2', 'eq', source_entity) | list)) | first }}
    button_1_entity: '{{ active_remote.button_1 }}'
    button_2_entity: '{{ active_remote.button_2 }}'
    gesture: >-
      {{ {'multi_press_1': 'single', 'multi_press_2': 'double', 'long_press': 'hold'}
         [trigger.event.data.new_state.attributes.event_type]
         ~ ('_1' if source_entity == button_1_entity else '_2') }}
- choose:
  - conditions:
    - condition: template
      value_template: '{{ gesture == ''single_1'' }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ not dimming_light_entities }}'
      then:
      - stop: Select at least one light to control.
        error: true
    - repeat:
        for_each: '{{ dimming_light_entities }}'
        sequence:
        - action: light.turn_on
          continue_on_error: true
          target:
            entity_id: '{{ repeat.item }}'
  - conditions:
    - condition: template
      value_template: '{{ gesture == ''single_2'' }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ not dimming_light_entities }}'
      then:
      - stop: Select at least one light to control.
        error: true
    - repeat:
        for_each: '{{ dimming_light_entities }}'
        sequence:
        - action: light.turn_off
          continue_on_error: true
          target:
            entity_id: '{{ repeat.item }}'
  - conditions:
    - condition: template
      value_template: '{{ gesture == ''double_1'' }}'
    sequence:
    - variables:
        color_temp_step_direction: -1
    - sequence: &color_temp_double_click_steps
      - repeat:
          for_each: '{{ dimming_light_entities }}'
          sequence:
          - if:
            - condition: template
              value_template: "{{ has_value(repeat.item) and is_state(repeat.item, 'on') and 'color_temp' in (state_attr(repeat.item, 'supported_color_modes') or []) }}"
            then:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id: '{{ repeat.item }}'
              data:
                transition: '{{ color_temp_double_click_transition }}'
                color_temp_kelvin: >-
                  {{ [[state_attr(repeat.item, 'color_temp_kelvin')
                      | int(cold_kelvin if color_temp_step_direction > 0 else warm_kelvin)
                      - color_temp_step_direction * color_temp_double_click_step_kelvin,
                      warm_kelvin] | max, cold_kelvin] | min }}
  - conditions:
    - condition: template
      value_template: '{{ gesture == ''double_2'' }}'
    sequence:
    - variables:
        color_temp_step_direction: 1
    - sequence: *color_temp_double_click_steps
  - conditions:
    - condition: template
      value_template: '{{ gesture == ''hold_1'' }}'
    sequence:
    - variables:
        dim_direction: 1
        dim_release_entity: '{{ button_1_entity }}'
    - sequence: &dim_selected_lights
      - if:
        - condition: template
          value_template: '{{ not dimming_light_entities }}'
        then:
        - stop: Select at least one light to dim.
          error: true
      - if:
        - condition: template
          value_template: '{{ is_state_attr(dim_release_entity, ''event_type'', ''long_release'') }}'
        then:
        - stop: The button was released before dimming started.
      - variables:
          dim_targets: >-
            {%- set ns = namespace(lights=[]) -%}
            {%- for entity in dimming_light_entities -%}
              {%- if has_value(entity) and (dim_direction > 0 or is_state(entity, 'on')) -%}
                {%- set start = 3 if is_state(entity, 'off') else state_attr(entity, 'brightness') | int(0) -%}
                {%- set start = [[start, 0] | max, 255] | min -%}
                {%- set ct = color_temp_dimming and 'color_temp' in (state_attr(entity, 'supported_color_modes') or []) -%}
                {%- set k0 = state_attr(entity, 'color_temp_kelvin') or (warm_kelvin + (cold_kelvin - warm_kelvin) * start / 255) -%}
                {%- set k1 = cold_kelvin if dim_direction > 0 else warm_kelvin -%}
                {%- set rem_b = ((255 - start) if dim_direction > 0 else (start - 1)) / 255 -%}
                {%- set rem_k = ((k1 - k0) * dim_direction / ([cold_kelvin - warm_kelvin, 1] | max)) if ct else 0 -%}
                {%- set dur = ([rem_b, rem_k, 0.004] | max) * scaled_ramp_time -%}
                {%- set rate = (((255 - start) if dim_direction > 0 else (start - 1)) | abs) / dur if ct else 254 / scaled_ramp_time -%}
                {%- set ns.lights = ns.lights + [{'entity_id': entity, 'brightness': start, 'ct': ct, 'kelvin': k0, 'duration': dur, 'rate': rate}] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.lights }}
      - if:
        - condition: template
          value_template: '{{ not dim_targets }}'
        then:
        - stop: No selected lights are available for this dimming direction.
      - repeat:
          for_each: '{{ dim_targets }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ dim_direction > 0 and is_state(repeat.item.entity_id, ''off'') }}'
            then:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id: '{{ repeat.item.entity_id }}'
              data:
                brightness_pct: 1
      - variables:
          hold_start_time: '{{ as_timestamp(now()) - latency_compensation_offset }}'
      - repeat:
          for_each: '{{ dim_targets }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ has_value(repeat.item.entity_id) }}'
            then:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id: '{{ repeat.item.entity_id }}'
              data: >-
                {{ dict({'brightness': 255 if dim_direction > 0 else 1,
                         'transition': repeat.item.duration},
                        **({'color_temp_kelvin': (cold_kelvin if dim_direction > 0 else warm_kelvin) | int}
                           if repeat.item.ct else {})) }}
      - variables:
          gesture_wait_completed: >-
            {{ is_state_attr(dim_release_entity, 'event_type', 'long_release')
               and not state_attr(dim_release_entity, 'restored')
               and as_timestamp(states(dim_release_entity), 0)
                   > as_timestamp(trigger.event.data.new_state.state, 0) }}
          gesture_wait_deadline: '{{ as_timestamp(now()) + 30 }}'
      - repeat:
          while:
          - condition: template
            value_template: '{{ not gesture_wait_completed and as_timestamp(now()) < gesture_wait_deadline }}'
          sequence:
          - wait_for_trigger:
            - trigger: event
              event_type: state_changed
              event_data:
                entity_id: '{{ dim_release_entity }}'
              id: release
            timeout:
              seconds: '{{ [gesture_wait_deadline - as_timestamp(now()), 0] | max }}'
            continue_on_timeout: true
          - if:
            - condition: template
              value_template: >-
                {% if wait.completed %}
                  {% set old = wait.trigger.event.data.old_state %}
                  {% set new = wait.trigger.event.data.new_state %}
                  {{ old is not none and new is not none
                     and old.state not in ['unknown', 'unavailable']
                     and new.state not in ['unknown', 'unavailable']
                     and not old.attributes.get('restored', false)
                     and not new.attributes.get('restored', false)
                     and as_timestamp(new.state, 0) > as_timestamp(old.state, 0)
                     and new.attributes.get('event_type') == 'long_release' }}
                {% else %}false{% endif %}
            then:
            - variables:
                gesture_wait_completed: true
      - variables:
          dim_elapsed: '{{ [as_timestamp(now()) - hold_start_time, 0] | max }}'
      - repeat:
          for_each: '{{ dim_targets }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ has_value(repeat.item.entity_id) }}'
            then:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id: '{{ repeat.item.entity_id }}'
              data: >-
                {%- set p = [dim_elapsed / repeat.item.duration, 1] | min -%}
                {%- set k1 = cold_kelvin if dim_direction > 0 else warm_kelvin -%}
                {{ dict({'brightness': ([[repeat.item.brightness + dim_direction * repeat.item.rate * dim_elapsed, 1] | max, 255] | min) | round(0) | int,
                         'transition': release_transition},
                        **({'color_temp_kelvin': (repeat.item.kelvin + (k1 - repeat.item.kelvin) * p) | round(0) | int}
                           if repeat.item.ct else {})) }}
  - conditions:
    - condition: template
      value_template: '{{ gesture == ''hold_2'' }}'
    sequence:
    - variables:
        dim_direction: -1
        dim_release_entity: '{{ button_2_entity }}'
    - sequence: *dim_selected_lights